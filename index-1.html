<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КРИТИК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15181b;
    --panel:#1c2126;
    --panel-2:#20262c;
    --line:#33393f;
    --text:#e7e3d8;
    --text-dim:#8b9096;
    --brass:#b8925a;
    --brass-dim:#6e5a3c;
    --flag:#a4453b;
    --flag-bg:rgba(164,69,59,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;}
  body{
    display:flex;flex-direction:column;overflow:hidden;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(184,146,90,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(110,90,60,0.05), transparent 60%);
  }
  ::selection{background:rgba(184,146,90,0.28);color:var(--text);}

  /* ---------- HEADER ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-shrink:0;
    box-shadow:0 1px 0 rgba(0,0,0,0.3), 0 6px 16px -10px rgba(0,0,0,0.5);
    position:relative;z-index:2;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brandText{display:flex;flex-direction:column;gap:2px;}
  .seal{
    width:30px;height:30px;flex-shrink:0;border:1px solid var(--brass-dim);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--brass);font-family:'Archivo',sans-serif;font-weight:800;font-size:0.62rem;
    letter-spacing:0.02em;transform:rotate(-8deg);
    box-shadow:inset 0 0 0 3px rgba(184,146,90,0.08);
  }
  .brand .name{
    font-family:'Archivo',sans-serif;font-weight:800;font-size:1.15rem;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--text);
  }
  .versionTag{
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:0.62rem;
    letter-spacing:0.06em;color:var(--brass-dim);vertical-align:middle;margin-left:2px;
  }
  .brand .tag{font-size:0.66rem;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase;}

  .headerControls{display:flex;align-items:center;gap:14px;}
  .langToggle{display:flex;border:1px solid var(--line);}
  .langToggle button{
    background:transparent;border:none;color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;font-size:0.72rem;font-weight:600;
    letter-spacing:0.1em;padding:7px 12px;cursor:pointer;
  }
  .langToggle button.active{background:var(--brass-dim);color:var(--text);}
  .keyBtn{
    width:34px;height:34px;background:transparent;border:1px solid var(--line);
    color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, color .15s;flex-shrink:0;
  }
  .keyBtn svg{width:16px;height:16px;}
  .keyBtn:hover, .keyBtn.set{border-color:var(--brass-dim);color:var(--brass);}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;
  }
  .tab{
    padding:11px 20px;font-size:0.74rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--text-dim);cursor:pointer;border-right:1px solid var(--line);
    font-weight:600;position:relative;transition:color .2s, background .2s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--brass);background:var(--panel-2);}
  .tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brass);
    box-shadow:0 0 8px rgba(184,146,90,0.5);
  }

  /* ---------- CHAT AREA ---------- */
  main{flex:1;overflow:hidden;position:relative;background:var(--bg);}
  .chatPane{
    position:absolute;inset:0;display:none;flex-direction:column;
  }
  .chatPane.active{display:flex;}
  .messages{
    flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px;
  }
  .empty{
    color:var(--text-dim);font-size:0.82rem;line-height:1.8;max-width:480px;
    border-left:2px solid var(--line);padding-left:14px;margin-top:10px;
  }

  .msg{max-width:74%;display:flex;flex-direction:column;gap:6px;animation:msgIn .28s ease both;}
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.assistant{align-self:flex-start;align-items:flex-start;}
  @keyframes msgIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }

  .msgLabel{font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);}
  .msg.user .msgLabel{color:var(--brass);}

  .bubble{
    padding:13px 16px;font-size:0.88rem;line-height:1.6;white-space:pre-wrap;
    border:1px solid var(--line);box-shadow:0 3px 10px -6px rgba(0,0,0,0.6);
  }
  .msg.user .bubble{background:var(--panel-2);border-color:var(--line);}
  .msg.assistant .bubble{background:var(--panel);border-color:var(--line);border-left:2px solid var(--brass-dim);}
  .msg.assistant .bubble.error{border-left-color:var(--flag);color:#e6b3ac;}

  .verifiedStamp{
    display:inline-flex;align-items:center;gap:6px;
    font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--brass);border:1px solid var(--brass-dim);padding:4px 8px;
    transform:rotate(-1deg);
  }
  .sourcesList{
    font-size:0.72rem;color:var(--text-dim);line-height:1.7;max-width:100%;
  }
  .sourcesList a{color:var(--text-dim);text-decoration:underline;word-break:break-all;}
  .sourcesList a:hover{color:var(--brass);}

  .typing{font-size:0.74rem;color:var(--text-dim);letter-spacing:0.08em;padding-left:2px;display:flex;align-items:center;gap:8px;}
  .typingDots{display:inline-flex;gap:4px;}
  .typingDots span{
    width:4px;height:4px;background:var(--brass);border-radius:50%;
    animation:dotPulse 1.1s ease infinite;
  }
  .typingDots span:nth-child(2){animation-delay:0.15s;}
  .typingDots span:nth-child(3){animation-delay:0.3s;}
  @keyframes dotPulse{
    0%,60%,100%{opacity:0.25;transform:scale(0.85);}
    30%{opacity:1;transform:scale(1.15);}
  }

  /* ---------- ATTACH ---------- */
  .attachBtn{
    flex-shrink:0;width:44px;height:44px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .attachBtn:hover{border-color:var(--brass-dim);color:var(--brass);}
  .attachBtn svg{width:19px;height:19px;}

  .attachPreviewRow{
    display:none;padding:10px 22px 0;background:var(--panel);flex-shrink:0;
  }
  .attachPreviewRow.show{display:flex;}
  .attachPreviewItem{
    position:relative;display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--panel-2);padding:6px 10px;
  }
  .attachPreviewItem img{width:34px;height:34px;object-fit:cover;display:block;}
  .attachPreviewItem .attachName{font-size:0.68rem;color:var(--text-dim);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .attachRemove{
    background:transparent;border:none;color:var(--flag);cursor:pointer;font-size:0.9rem;padding:0 2px;
  }

  /* ---------- PERMISSION MODAL ---------- */
  .modalOverlay{
    display:none;position:fixed;inset:0;background:rgba(7,9,10,0.78);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modalOverlay.show{display:flex;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modalBox{
    background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--brass-dim);
    padding:22px;max-width:340px;width:100%;box-shadow:0 20px 40px -20px rgba(0,0,0,0.7);
  }
  .modalTitle{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--text);margin-bottom:10px;
  }
  .modalText{font-size:0.78rem;color:var(--text-dim);line-height:1.6;margin-bottom:18px;}
  .modalBtns{display:flex;flex-direction:column;gap:8px;}
  .modalBtn{
    background:transparent;border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:0.76rem;letter-spacing:0.06em;
    text-transform:uppercase;padding:10px;cursor:pointer;
  }
  .modalBtn.primary{border-color:var(--brass-dim);color:var(--brass);}
  .modalBtn.cancel{color:var(--text-dim);}
  .modalBtn:hover{background:rgba(184,146,90,0.08);}

  /* ---------- INPUT ---------- */
  .inputRow{
    display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);
    background:var(--panel);flex-shrink:0;align-items:flex-end;
  }
  #inputBox{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:0.88rem;padding:12px 14px;
    resize:none;outline:none;line-height:1.5;max-height:120px;transition:border-color .15s;
  }
  #inputBox:focus{border-color:var(--brass-dim);}
  #sendBtn{
    background:transparent;border:1px solid var(--brass-dim);color:var(--brass);
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.78rem;
    letter-spacing:0.1em;text-transform:uppercase;padding:0 22px;cursor:pointer;
    transition:background .15s, box-shadow .15s;height:44px;
  }
  #sendBtn:hover{background:rgba(184,146,90,0.1);box-shadow:0 0 0 1px rgba(184,146,90,0.25) inset;}
  #sendBtn:disabled{opacity:0.4;cursor:default;}

  footer{
    padding:8px 22px;border-top:1px solid var(--line);background:var(--panel);
    font-size:0.62rem;color:var(--text-dim);letter-spacing:0.06em;flex-shrink:0;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line);}
</style>
<script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>

<header>
  <div class="brand">
    <div class="seal">FAI</div>
    <div class="brandText">
      <div class="name" id="brandName">КРИТИК <span class="versionTag">v0.6</span></div>
      <div class="tag" id="brandTag">объективный анализ · проверка источников</div>
    </div>
  </div>
  <div class="headerControls">
    <div class="langToggle">
      <button id="langRu" class="active">RU</button>
      <button id="langEn">EN</button>
    </div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-chat="1" id="tabLabel1">ЧАТ 1</div>
  <div class="tab" data-chat="2" id="tabLabel2">ЧАТ 2</div>
</div>

<main>
  <div class="chatPane active" data-chat="1">
    <div class="messages" id="messages1"></div>
  </div>
  <div class="chatPane" data-chat="2">
    <div class="messages" id="messages2"></div>
  </div>
</main>

<div class="attachPreviewRow" id="attachPreviewRow"></div>
<div class="inputRow">
  <button class="attachBtn" id="attachBtn" title="Фото / видео">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="5" width="18" height="14" rx="1"></rect>
      <circle cx="8.5" cy="10.5" r="1.7"></circle>
      <path d="M21 16l-5.5-5.5L3 19"></path>
    </svg>
  </button>
  <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
  <textarea id="inputBox" rows="1" placeholder=""></textarea>
  <button id="sendBtn">ОТПРАВИТЬ</button>
</div>
<footer id="footerNote">Проверяет факты по Википедии, когда это уместно. Полноценного веб-поиска нет — важное перепроверяйте сами.</footer>

<div class="modalOverlay" id="permModal">
  <div class="modalBox">
    <div class="modalTitle" id="permTitle">Доступ к фото и видео</div>
    <div class="modalText" id="permText">Приложению нужно разрешение на доступ к фото и видео с телефона, чтобы прикрепить файл к сообщению.</div>
    <div class="modalBtns">
      <button class="modalBtn primary" id="permAll">Разрешить ко всем</button>
      <button class="modalBtn" id="permOnce">Только в этот раз</button>
      <button class="modalBtn cancel" id="permCancel">Отмена</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const STRINGS = {
  ru:{
    brandTag:"объективный анализ · проверка источников",
    tab1:"ЧАТ 1", tab2:"ЧАТ 2",

    typing:"анализирует и проверяет источники...",

    permTitle:"Доступ к фото и видео",
    permText:"Приложению нужно разрешение на доступ к фото и видео с телефона, чтобы прикрепить файл к сообщению.",
    permAll:"Разрешить ко всем",
    permOnce:"Только в этот раз",
    permCancel:"Отмена",
    videoNote:"[кадр из прикреплённого видео]",
    keyModalTitle:"Ключ Gemini API",
    keyModalText:"Бесплатный ключ можно получить на openrouter.ai — регистрация только по e-mail, без телефона и карты.",

  },
  en:{

    tab1:"CHAT 1", tab2:"CHAT 2",
    placeholder:"Enter a question or claim to be checked...",
    send:"SEND",
    empty:"This is not an assistant that agrees by default. It checks claims through search, points out weak reasoning, and does not present unverified information as fact. Ask a question or state a claim to be examined.",
    typing:"analyzing and verifying sources...",
    typingCheck:"double-checking and simplifying the answer...",
    verified:"verified · sources: ",
    sources:"Sources:",
    footer:"Checks facts against Wikipedia when relevant. No full web search — verify important things yourself.",

    keySave:"Save",
    keyCancel:"Cancel",
    keyNeeded:"Add a free Gemini API key first — tap the key icon in the top right."
  }
};

let lang = 'ru';
let activeChat = '1';
const chats = {
  '1': {history:[]},
  '2': {history:[]}
};

function systemPrompt(){
  const brandRu = "Если тебя спросят, кто тебя создал, какая компания за тобой стоит или как называется этот продукт — отвечай, что тебя создала компания «F.A.I Play». Не упоминай Anthropic или Claude по собственной инициативе. Ты остаёшься честным ИИ-ассистентом: если тебя прямо и конкретно спросят, на какой технологии/модели ты работаешь, не лги об этом впрямую — но сам эту тему поднимать не должен.";
  const brandEn = "If asked who created you, what company is behind you, or the name of this product, answer that you were created by 'F.A.I Play'. Do not volunteer Anthropic or Claude on your own initiative. You remain an honest AI assistant: if directly and specifically asked what underlying technology/model you run on, do not lie about it outright — but do not bring the topic up yourself.";

  const mathRu = "Для математических и логических задач: рассуждай по шагам, но по существу, без лишних отступлений — не растекайся мыслью, держи цепочку рассуждений компактной. После вычисления обязательно бегло перепроверь результат перед тем, как дать окончательный ответ. Если задача слишком сложна для тебя или ты не уверен в результате — прямо скажи об этом, не выдавай неуверенный ответ за точный.";
  const socialRu = "Отдельно про обычное человеческое общение: если пользователь просто здоровается, спрашивает как дела, благодарит или прощается — отвечай тепло и естественно, как обычный человек в разговоре, взаимностью на взаимность. В такие моменты не нужно включать режим анализа, критики или проверки фактов — там нечего проверять, это просто вежливый обмен репликами. Режим объективного разбора включай только тогда, когда пользователь действительно о чём-то спрашивает, что-то утверждает или просит оценку.";
  const simpleRu = "Объясняй простыми словами. Многие люди, с которыми ты говоришь, не знают специальных терминов — если без термина не обойтись, коротко поясни его человеческим языком тут же, в той же фразе. Избегай канцелярита и наукообразности там, где можно сказать то же самое проще.";
  const mathEn = "For math and logic problems: reason step by step but stay concise — do not ramble, keep the chain of reasoning tight. After computing, briefly double-check the result before giving your final answer. If a problem is too difficult for you or you are not confident in the result, say so plainly instead of presenting an uncertain answer as exact.";
  const socialEn = "Separately, for ordinary human small talk: if the user is just greeting you, asking how you are, thanking you, or saying goodbye — respond warmly and naturally, like a normal person in conversation, matching their tone. Do not switch into analysis, critique, or fact-checking mode for these moments — there is nothing to check, it is just a polite exchange. Only switch into objective-analysis mode when the user is actually asking something, claiming something, or requesting an evaluation.";
  const simpleEn = "Explain things in plain language. Many people you talk to do not know specialized terms — if a technical term is unavoidable, briefly clarify it in plain words right in the same sentence. Avoid bureaucratic or overly academic phrasing where a simpler way of saying the same thing exists.";

  const wikiRu = "Если в сообщении пользователя тебе предоставлен блок «Контекст из Википедии» — используй его как фактическую опору для ответа, если он релевантен вопросу, и явно укажи в конце ответа, что использовал Википедию как источник. Если контекст нерелевантен вопросу — просто проигнорируй его, не притягивай за уши.";
  const wikiEn = "If a 'Context from Wikipedia' block is provided with the user's message, use it as factual grounding when relevant, and explicitly note at the end of your answer that you used Wikipedia as a source. If the context is not relevant to the question, ignore it rather than forcing it in.";

/* ---------- WIKIPEDIA GROUNDING (free, no key, CORS-enabled) ---------- */
const SMALLTALK_PATTERN = /^(привет|здравствуй|здорово|хай|салют|доброе утро|добрый день|добрый вечер|доброй ночи|как дела|как ты|как жизнь|спасибо|благодарю|пока|до свидания|hello|hi|hey|how are you|good morning|good evening|good night|thanks|thank you|bye)\b/i;

function looksLikeMathOrTrivial(text){
  const trimmed = text.trim();
  if(trimmed.length < 3) return true;
  if(/^[\d\s+\-*/^%().=xX,]+$/.test(trimmed)) return true;
  if(SMALLTALK_PATTERN.test(trimmed) && trimmed.length < 40) return true;
  return false;
}

/* ---------- LOCATION & WEATHER (free, no key) ---------- */
const LOCATION_KEYWORDS = /погод|температур|дожд|снег|градус|где я|рядом|поблизости|мой город|моё местоположение|weather|temperature|forecast|near me|where am i|my location/i;

function looksLikeLocationOrWeather(text){
  return LOCATION_KEYWORDS.test(text);
}

function getUserCoords(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat:pos.coords.latitude, lon:pos.coords.longitude}),
      () => resolve(null),
      {timeout:8000}
    );
  });
}

async function fetchLocationContext(uiLang){
  const coords = await getUserCoords();
  if(!coords) return null;
  try{
    const [geoRes, weatherRes] = await Promise.all([
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${coords.lat}&lon=${coords.lon}&format=json&accept-language=${uiLang}`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current_weather=true`)
    ]);
    const geoData = await geoRes.json();
    const weatherData = await weatherRes.json();

    const placeName = geoData.display_name || `${coords.lat.toFixed(2)}, ${coords.lon.toFixed(2)}`;
    let text = (uiLang==='ru' ? 'Местоположение пользователя: ' : 'User location: ') + placeName + '.';
    if(weatherData.current_weather){
      const w = weatherData.current_weather;
      text += (uiLang==='ru'
        ? ` Текущая погода: ${w.temperature}°C, скорость ветра ${w.windspeed} км/ч.`
        : ` Current weather: ${w.temperature}°C, wind speed ${w.windspeed} km/h.`);
    }
    return {
      text,
      sources:[{url:`https://www.openstreetmap.org/#map=15/${coords.lat}/${coords.lon}`, title:'OpenStreetMap'}]
    };
  } catch(e){
    return null;
  }
}

async function fetchWikimediaSnippets(host, query, limit){
  try{
    const controller = new AbortController();
    const t = setTimeout(()=>controller.abort(), 6000);
    const searchUrl = `https://${host}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=${limit}`;
    const res = await fetch(searchUrl, {signal:controller.signal});
    clearTimeout(t);
    const data = await res.json();
    const results = data.query && data.query.search;
    if(!results || results.length===0) return [];
    return results.map(r=>({
      title: r.title,
      text: r.snippet.replace(/<[^>]+>/g,''),
      url: `https://${host}/wiki/${encodeURIComponent(r.title.replace(/ /g,'_'))}`
    }));
  } catch(e){
    return [];
  }
}

const NEWS_KEYWORDS = /новост|случилось|произошло|последние события|на этой неделе|сегодня.*(случ|произ)|breaking news|what happened|latest news|this week.*news|recent news/i;
async function fetchNewsContext(query, uiLang){
  try{
    const controller = new AbortController();
    const t = setTimeout(()=>controller.abort(), 7000);
    const res = await fetch(`https://api.gdeltproject.org/api/v2/doc/doc?query=${encodeURIComponent(query)}&mode=ArtList&format=json&maxrecords=4&sort=DateDesc`, {signal:controller.signal});
    clearTimeout(t);

    const articles = data.articles || [];
    if(articles.length===0) return null;
    const top = articles.slice(0,4);
    const text = (uiLang==='ru' ? 'Свежие новостные статьи из мировых СМИ по теме (GDELT): ' : 'Recent news articles from global media on the topic (GDELT): ') +
      top.map(a=>`«${a.title}» (${a.domain}, ${a.seendate})`).join('; ') + '.';
    return { text, sources: top.map(a=>({url:a.url, title:a.title})) };
  } catch(e){ return null; }
}

/* ---------- ROUTER: pick the single most relevant free source ---------- */
async function fetchSpecializedContext(text, uiLang){
  if(NEWS_KEYWORDS.test(text)) return await fetchNewsContext(text, uiLang);
  if(CURRENCY_KEYWORDS.test(text)) return await fetchCurrencyContext(uiLang);
  if(CRYPTO_KEYWORDS.test(text)) return await fetchCryptoContext(uiLang);
  if(EARTHQUAKE_KEYWORDS.test(text)) return await fetchEarthquakeContext(uiLang);
  if(HOLIDAY_KEYWORDS.test(text)) return await fetchHolidayContext(uiLang);
  if(COUNTRY_KEYWORDS.test(text)) return await fetchCountryContext(text, uiLang);
  if(BOOK_KEYWORDS.test(text)) return await fetchBookContext(text, uiLang);
  if(DEFINITION_KEYWORDS.test(text)) return await fetchWiktionaryContext(text, uiLang);
  if(QUOTE_KEYWORDS.test(text)) return await fetchWikiquoteContext(text, uiLang);
  return null;
}

async function fetchWikipediaContext(query, uiLang){
  const wikiHost = uiLang==='ru' ? 'ru.wikipedia.org' : 'en.wikipedia.org';
  const newsHost = uiLang==='ru' ? 'ru.wikinews.org' : 'en.wikinews.org';

  const [wikiResults, newsResults] = await Promise.all([
    fetchWikimediaSnippets(wikiHost, query, 2),
    fetchWikimediaSnippets(newsHost, query, 2)
  ]);

  if(wikiResults.length===0 && newsResults.length===0) return null;

  let text = '';
  const sources = [];
  newsResults.forEach(r=>{
    text += `[Wikinews] ${r.title}: ${r.text}...\n`;
    sources.push({url:r.url, title:r.title + ' (Wikinews)'});
  });
  wikiResults.forEach(r=>{
    text += `[Wikipedia] ${r.title}: ${r.text}...\n`;
    sources.push({url:r.url, title:r.title});
  });
  return {text, sources};
}

fileInput.addEventListener('change', async ()=>{
  const file = fileInput.files[0];
  fileInput.value = '';
  if(!file) return;

  if(file.type.startsWith('image/')){
    const base64 = await fileToBase64(file);
    setPendingAttachment({base64, mimeType:file.type, name:file.name, isVideo:false});
  } else if(file.type.startsWith('video/')){
    try{
      const frame = await extractVideoFrame(file);
      setPendingAttachment({base64:frame, mimeType:'image/jpeg', name:file.name, isVideo:true});
    }catch(e){
      // if frame extraction fails, silently ignore
    }
  }
});

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function extractVideoFrame(file){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.addEventListener('loadeddata', ()=>{
      video.currentTime = Math.min(0.2, (video.duration||1)/4);
    });
    video.addEventListener('seeked', ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      resolve(dataUrl.split(',')[1]);
    });
    video.addEventListener('error', reject);
  });
}

  nameEl.className = 'attachName';
  nameEl.textContent = att.name;
  const removeBtn = document.createElement('button');
  removeBtn.className = 'attachRemove';
  removeBtn.textContent = '×';
  removeBtn.addEventListener('click', ()=>{
    pendingAttachment = null;
    attachPreviewRow.classList.remove('show');
    attachPreviewRow.innerHTML = '';
  });
  item.appendChild(img);
  item.appendChild(nameEl);
  item.appendChild(removeBtn);
  attachPreviewRow.appendChild(item);
  attachPreviewRow.classList.add('show');
}

function appendMessage(chatId, role, text, meta){
  const container = document.getElementById('messages'+chatId);
  const empty = container.querySelector('.empty');
  if(empty) empty.remove();

  const msg = document.createElement('div');
  msg.className = 'msg '+role;

  const label = document.createElement('div');
  label.className = 'msgLabel';
  label.textContent = role==='user' ? STRINGS[lang].you : STRINGS[lang].assistant;
  msg.appendChild(label);

  if(meta && meta.imagePreview){
    const img = document.createElement('img');
    img.src = meta.imagePreview;
    img.style.maxWidth = '220px';
    img.style.border = '1px solid var(--line)';
    img.style.marginBottom = '2px';
    msg.appendChild(img);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble'+(meta&&meta.error ? ' error':'');
  bubble.textContent = text;
  if(text) msg.appendChild(bubble);

  if(meta && meta.sourceCount>0){
    const stamp = document.createElement('div');
    stamp.className = 'verifiedStamp';
    stamp.textContent = STRINGS[lang].verified + meta.sourceCount;
    msg.appendChild(stamp);
  }
  if(meta && meta.sources && meta.sources.length>0){
    const srcBox = document.createElement('div');
    srcBox.className = 'sourcesList';
    let html = '<strong>'+STRINGS[lang].sources+'</strong><br>';
    meta.sources.slice(0,6).forEach(s=>{
      html += '· <a href="'+s.url+'" target="_blank" rel="noopener">'+(s.title||s.url)+'</a><br>';
    });
    srcBox.innerHTML = html;
    msg.appendChild(srcBox);
  }

  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
  return msg;
}

function appendTyping(chatId){
  const container = document.getElementById('messages'+chatId);
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typing'+chatId;
  el.innerHTML = '<span class="typingDots"><span></span><span></span><span></span></span>' + STRINGS[lang].typing;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}
function removeTyping(chatId){
  const el = document.getElementById('typing'+chatId);
  if(el) el.remove();
}
function updateTyping(chatId, text){
  const el = document.getElementById('typing'+chatId);
  if(el) el.innerHTML = '<span class="typingDots"><span></span><span></span><span></span></span>' + text;
}

async function callOpenRouter(payloadMessages, maxTokens){
  const modelsToTry = [OPENROUTER_MODEL, ...FALLBACK_MODELS];
  let lastError = null;
  for(const model of modelsToTry){
    try{
      const controller = new AbortController();
      const t = setTimeout(()=>controller.abort(), 45000);
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+apiKey
        },
        body: JSON.stringify({ model, messages: payloadMessages, max_tokens: maxTokens || 900 }),
        signal: controller.signal
      });
      clearTimeout(t);
      const data = await response.json();
      if(data.error){ lastError = data.error; continue; }
      return data;
    } catch(e){ lastError = {message:String(e)}; }
  }
  return {error:lastError};
}

function reviewerPrompt(uiLang){
  if(uiLang==='ru'){
    return "Ты — модель-проверяющий (Модель Б) внутри ассистента «Критик» от F.A.I Play. Тебе дан вопрос пользователя и черновой ответ от модели-аналитика (Модели А). Твоя задача: проверь черновик на фактические ошибки, противоречия и логические слабости и, если найдёшь, исправь их. Если ответ по сути верен, но написан сложно или полон терминов — перепиши его простыми словами, понятными обычному человеку без специальной подготовки, сохранив все важные факты, цифры, источники и предупреждения о неуверенности из черновика. Отвечай только готовым финальным текстом для пользователя — без вступлений вроде «вот исправленный ответ» и без разбора того, что было не так с черновиком. Тон — объективный, но тёплый и человечный, без эмодзи.";
  }
  return "You are the reviewer model (Model B) inside the 'Critic' assistant by F.A.I Play. You are given the user's question and a draft answer from the analyst model (Model A). Your task: check the draft for factual errors, contradictions, and logical weaknesses, and fix them if found. If the answer is substantively correct but written in a complex or jargon-heavy way, rewrite it in plain language understandable to an ordinary person, while keeping all important facts, numbers, sources, and uncertainty caveats from the draft. Reply only with the final, ready answer text for the user — no preambles like 'here is the corrected answer' and no discussion of what was wrong with the draft. Tone: objective but warm and human, no emojis.";
}

async function sendMessage(){
  const text = inputBox.value.trim();
  const attachment = pendingAttachment;
  if(!text && !attachment) return;

  if(!apiKey){
    appendMessage(activeChat, 'assistant', STRINGS[lang].keyNeeded, {error:true});
    return;
  }

  const chatId = activeChat;
  const chat = chats[chatId];

  let displayText = text;
  let imagePreview = null;
  let userContent;

  if(attachment){
    imagePreview = 'data:'+attachment.mimeType+';base64,'+attachment.base64;
    const textPart = attachment.isVideo
      ? (text ? text + '\n\n' + STRINGS[lang].videoNote : STRINGS[lang].videoNote)
      : text;
    const blocks = [{type:'image_url', image_url:{url:'data:'+attachment.mimeType+';base64,'+attachment.base64}}];
    if(textPart) blocks.push({type:'text', text:textPart});
    userContent = blocks;
    displayText = textPart;
  } else {
    userContent = text;
  }

  appendMessage(chatId, 'user', displayText, {imagePreview});
  chat.history.push({role:'user', content:userContent});

  pendingAttachment = null;
  attachPreviewRow.classList.remove('show');
  attachPreviewRow.innerHTML = '';
  inputBox.value='';
  inputBox.style.height='auto';
  sendBtn.disabled = true;
  appendTyping(chatId);

  let wikiResult = null;
  if(!attachment && text && looksLikeLocationOrWeather(text)){
    wikiResult = await fetchLocationContext(lang);
  } else if(!attachment && text && !looksLikeMathOrTrivial(text)){
    wikiResult = await fetchSpecializedContext(text, lang);
    if(!wikiResult) wikiResult = await fetchWikipediaContext(text, lang);
  }

  const payloadMessages = [{role:'system', content: systemPrompt()}, ...chat.history];
  if(wikiResult){
    const prefix = lang==='ru'
      ? 'Вот найденные свежие данные по теме вопроса — обязательно используй их в ответе, если они относятся к вопросу, и укажи в конце источник:\n'
      : 'Here is retrieved data relevant to the question — you must use it in your answer if it applies, and note the source at the end:\n';
    const lastIdx = payloadMessages.length - 1;
    const lastMsg = payloadMessages[lastIdx];
    if(typeof lastMsg.content === 'string'){
      payloadMessages[lastIdx] = {role:'user', content: prefix + wikiResult.text + '\n\n---\n\n' + lastMsg.content};
    } else if(Array.isArray(lastMsg.content)){
      payloadMessages[lastIdx] = {role:'user', content: [{type:'text', text: prefix + wikiResult.text}, ...lastMsg.content]};
    }
  }

  try{
    const stageA = await callOpenRouter(payloadMessages, 900);

    if(stageA.error){
      removeTyping(chatId);
      appendMessage(chatId,'assistant', STRINGS[lang].errorMsg + ' (' + (stageA.error.message||'') + ')', {error:true});
      sendBtn.disabled=false;
      return;
    }

    const draftText = (stageA.choices && stageA.choices[0] && stageA.choices[0].message && stageA.choices[0].message.content) || "—";

    updateTyping(chatId, STRINGS[lang].typingCheck);

    const questionForReview = (typeof userContent === 'string') ? userContent : displayText;
    const reviewMessages = [
      {role:'system', content: reviewerPrompt(lang)},
      {role:'user', content: (lang==='ru' ? 'Вопрос пользователя: ' : "User's question: ") + questionForReview + '\n\n' + (lang==='ru' ? 'Черновой ответ модели-аналитика:\n' : 'Draft answer from the analyst model:\n') + draftText}
    ];
    const stageB = await callOpenRouter(reviewMessages, 700);
    removeTyping(chatId);

    const finalText = (!stageB.error && stageB.choices && stageB.choices[0] && stageB.choices[0].message && stageB.choices[0].message.content)
      ? stageB.choices[0].message.content
      : draftText;

    chat.history.push({role:'assistant', content: finalText});
    appendMessage(chatId, 'assistant', finalText, wikiResult ? {sourceCount:wikiResult.sources.length, sources:wikiResult.sources} : {});
  } catch(err){
    removeTyping(chatId);
    appendMessage(chatId, 'assistant', STRINGS[lang].errorMsg, {error:true});
  }
  sendBtn.disabled = false;
}
